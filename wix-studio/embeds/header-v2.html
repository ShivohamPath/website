<!DOCTYPE html>
<!--
  SHIVOHAMPATH · SITE HEADER (v2)
  Paste into ONE "Embed HTML" element inside the Wix HEADER (site-wide).
  Heights: Desktop 64px · Tablet 64px · Mobile 100px (see HOMEPAGE_V2_BUILD_GUIDE.md).
  On phones the links sit on a second row instead of a dropdown menu,
  because a menu can't open past the edge of an embed.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Cinzel:wght@400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a0a0f; --gold: #C9A84C; --gold-hi: #d9bc68; --text: #e8e0d0; --text-2: rgba(232,224,208,.70); --line: rgba(201,168,76,.22); }
  html, body { background: var(--bg); height: 100%; overflow: hidden; }
  body { font: 16px/1.4 'EB Garamond', Georgia, serif; color: var(--text); border-bottom: 1px solid var(--line); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .bar { max-width: 1080px; height: 100%; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); display: flex; align-items: center; gap: 28px; }
  .brand { font: 15px/1 'Cinzel', Georgia, serif; letter-spacing: .22em; white-space: nowrap; }
  .brand b { color: var(--gold); font-weight: 400; }
  .links { display: flex; gap: 26px; margin-left: auto; }
  .links a, .login { color: var(--text-2); transition: color .2s; }
  .links a:hover, .login:hover { color: var(--gold); }
  .btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; background: var(--gold); color: var(--bg);
    font: 11px/1 'Cinzel', Georgia, serif; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; transition: background .2s; }
  .btn:hover { background: var(--gold-hi); }

  .links .m-login { display: none; }

  @media (max-width: 750px) {
    .bar { flex-wrap: wrap; align-content: center; gap: 10px 14px; padding: 0 20px; }
    .brand { font-size: 13px; letter-spacing: .16em; }
    .btn { margin-left: auto; min-height: 36px; padding: 0 14px; letter-spacing: .14em; }
    .login { order: 3; }
    .links { order: 4; flex-basis: 100%; margin-left: 0; gap: 0; justify-content: space-between; }
    .links a, .login { font-size: 15px; }
    .login { display: none; }
    .links .m-login { display: inline; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="https://www.shivohampath.com/" target="_top">SHIVOHAM <b>PATH</b></a>
    <nav class="links" aria-label="Main">
      <a href="https://www.shivohampath.com/readings" target="_top">Readings</a>
      <a href="https://www.shivohampath.com/courses" target="_top">Courses</a>
      <a href="https://www.shivohampath.com/about" target="_top">About</a>
      <a href="https://www.shivohampath.com/blog" target="_top">Blog</a>
      <a class="m-login" href="https://www.shivohampath.com/account/my-account" target="_top">Log in</a>
    </nav>
    <a class="login" href="https://www.shivohampath.com/account/my-account" target="_top">Log in</a>
    <a class="btn" href="https://www.shivohampath.com/readings" target="_top">Book a Reading</a>
  </div>
</body>
</html>
