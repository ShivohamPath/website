<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════
  SHIVOHAMPATH · MOBILE NAV MEMBER BAR
  ═══════════════════════════════════════════════════════════════
  HOW TO ADD THIS TO YOUR WIX SITE:
  1. In Wix Studio editor, open the Header strip
  2. Add → Embed → HTML iFrame
  3. Paste the contents of this file
  4. Set the embed height to 48px, width to 100%
  5. Right-click the embed → Properties → set ID to: mobileNavEmbed
  6. In the editor, click the embed → "Hide on Desktop" so it only
     shows on mobile / tablet
  ═══════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #0a0a0f;
    --gold:  #C9A84C;
    --gold2: rgba(201,168,76,0.22);
    --gold3: rgba(201,168,76,0.10);
    --text:  #e8e0d0;
    --text3: rgba(232,224,208,0.40);
    --line:  rgba(232,224,208,0.07);
  }

  html, body {
    background: var(--bg);
    margin: 0; padding: 0;
    height: 48px; overflow: hidden;
    width: 100%;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    padding: 0 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--gold2);
  }

  .bar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Logged-out state */
  .btn-login {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
    border: 1px solid var(--gold2);
    padding: 6px 16px;
    transition: background 0.2s;
    display: inline-block;
  }
  .btn-login:hover { background: var(--gold3); }

  .btn-signup {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text3);
    text-decoration: none;
    padding: 6px 0;
    transition: color 0.2s;
    display: inline-block;
  }
  .btn-signup:hover { color: var(--gold); }

  /* Logged-in state */
  .account-link {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .account-dot {
    width: 5px; height: 5px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.7;
  }

  .btn-logout {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text3);
    text-decoration: none;
    display: inline-block;
    transition: color 0.2s;
  }
  .btn-logout:hover { color: var(--text); }

  .state-guest  { display: flex; align-items: center; gap: 16px; }
  .state-member { display: none;  align-items: center; gap: 16px; }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-right">
    <!-- Logged-out -->
    <div class="state-guest" id="stateGuest">
      <a href="https://www.shivohampath.com/my-account" target="_top" class="btn-login">Login</a>
      <a href="https://www.shivohampath.com/my-account" target="_top" class="btn-signup">Create Account</a>
    </div>

    <!-- Logged-in -->
    <div class="state-member" id="stateMember">
      <a href="https://www.shivohampath.com/my-account" target="_top" class="account-link">
        <div class="account-dot"></div>
        My Account
      </a>
      <a href="https://www.shivohampath.com/member-logout" target="_top" class="btn-logout">Logout</a>
    </div>
  </div>
</div>

<script>
  var guest  = document.getElementById('stateGuest');
  var member = document.getElementById('stateMember');

  function setState(loggedIn) {
    guest.style.display  = loggedIn ? 'none'  : 'flex';
    member.style.display = loggedIn ? 'flex'  : 'none';
  }

  // Receive member state from masterPage.js if embed ID is set
  window.addEventListener('message', function(e) {
    try {
      var data = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data;
      if (data && data.type === 'memberState') setState(data.loggedIn);
    } catch(err) {}
  });

</script>

</body>
</html>
