<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0f;
    margin: 0; padding: 0;
    height: 48px; overflow: hidden;
    width: 100%;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    background: #0a0a0f;
    border-bottom: 1px solid rgba(201,168,76,0.22);
    gap: 20px;
  }
  a {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    text-decoration: none;
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-login {
    color: #C9A84C;
    border: 1px solid rgba(201,168,76,0.22);
    padding: 0 16px;
  }
  .btn-signup {
    color: rgba(232,224,208,0.40);
  }
</style>
</head>
<body>
<div class="bar">
  <a href="/my-account" target="_top" class="btn-login">Login</a>
  <a href="/my-account" target="_top" class="btn-signup">Create Account</a>
</div>
</body>
</html>
