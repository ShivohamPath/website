<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0f;
    margin: 0; padding: 0;
    height: 48px; overflow: hidden;
    width: 100%;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    background: #0a0a0f;
    border-bottom: 1px solid rgba(201,168,76,0.22);
    gap: 20px;
  }
  a {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 2px;
    text-decoration: none;
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-login {
    color: #C9A84C;
    border: 1px solid rgba(201,168,76,0.22);
    padding: 0 16px;
  }
  .btn-signup {
    color: rgba(232,224,208,0.40);
  }
  .btn-account {
    color: #C9A84C;
    border: 1px solid rgba(201,168,76,0.22);
    padding: 0 16px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <!-- Logged-out state -->
  <a href="#" id="btnLogin" class="btn-login" onclick="sendMsg('memberLogin'); return false;">Login</a>
  <a href="#" id="btnSignup" class="btn-signup" onclick="sendMsg('memberSignup'); return false;">Create Account</a>
  <!-- Logged-in state -->
  <a href="/my-account" target="_top" id="btnAccount" class="btn-account hidden">My Account</a>
  <a href="#" id="btnLogout" class="btn-signup hidden" onclick="sendMsg('memberLogout'); return false;">Logout</a>
</div>
<script>
  function sendMsg(type) {
    window.parent.postMessage({ type: type }, '*');
  }

  function setState(loggedIn) {
    document.getElementById('btnLogin').classList.toggle('hidden', loggedIn);
    document.getElementById('btnSignup').classList.toggle('hidden', loggedIn);
    document.getElementById('btnAccount').classList.toggle('hidden', !loggedIn);
    document.getElementById('btnLogout').classList.toggle('hidden', !loggedIn);
  }

  window.addEventListener('message', function(e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) {} }
    if (d && d.type === 'memberState') setState(!!d.loggedIn);
  });
</script>
</body>
</html>
