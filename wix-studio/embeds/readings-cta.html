<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #0a0a0f;
    --bg3:   #131020;
    --bg4:   #1a1525;
    --gold:  #C9A84C;
    --gold2: rgba(201,168,76,0.45);
    --gold3: rgba(201,168,76,0.12);
    --gold4: rgba(201,168,76,0.05);
    --text:  #e8e0d0;
    --text2: rgba(232,224,208,0.65);
    --text3: rgba(232,224,208,0.35);
    --line:  rgba(232,224,208,0.07);
    --line2: rgba(201,168,76,0.22);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    overflow-x: hidden;
    margin: 0; padding: 0;
  }

  .cta-section { padding: 70px 20px 80px; }
  .cta-inner { max-width: 900px; margin: 0 auto; }

  /* ── HEADER ── */
  .cta-header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-family: 'Cinzel', serif; font-size: 10px;
    letter-spacing: 4px; color: var(--gold);
    display: block; margin-bottom: 16px;
  }
  .cta-header h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 300; color: var(--text);
    line-height: 1.12; margin-bottom: 20px;
  }
  .cta-header h3 em { font-style: italic; color: var(--gold); }
  .divider { display: flex; align-items: center; gap: 16px; justify-content: center; }
  .divider-line { flex: 1; max-width: 80px; height: 1px; background: var(--line2); }
  .divider-diamond {
    width: 6px; height: 6px; background: var(--gold);
    transform: rotate(45deg); opacity: 0.7; flex-shrink: 0;
  }

  /* ── CHOOSER SHELL ── */
  .chooser {
    background: var(--bg3);
    border: 1px solid var(--line2);
    padding: 44px 44px 38px;
    position: relative;
  }

  .progress {
    display: flex; align-items: center; gap: 8px;
    justify-content: center; margin-bottom: 30px;
  }
  .pip {
    width: 6px; height: 6px; background: var(--text3);
    transform: rotate(45deg); opacity: 0.4;
    transition: all 0.3s;
  }
  .pip.on { background: var(--gold); opacity: 1; }

  .q-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 400; color: var(--text);
    text-align: center; line-height: 1.25;
    margin-bottom: 8px;
  }
  .q-sub {
    font-size: 14px; color: var(--text3);
    font-style: italic; text-align: center;
    margin-bottom: 30px; line-height: 1.6;
  }

  .options { display: grid; gap: 4px; }
  .options.two { grid-template-columns: 1fr 1fr; }
  .options.three { grid-template-columns: repeat(3, 1fr); }

  .opt {
    background: var(--bg4); border: 1px solid var(--line);
    padding: 22px 20px; text-align: left;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--text); cursor: pointer;
    transition: all 0.25s; position: relative;
    display: flex; flex-direction: column; gap: 6px;
  }
  .opt:hover { border-color: var(--gold2); background: var(--gold4); }
  .opt-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px; font-weight: 400; color: var(--text);
    line-height: 1.25;
  }
  .opt:hover .opt-label { color: var(--gold); }
  .opt-sub { font-size: 13px; color: var(--text3); line-height: 1.6; }

  /* ── RESULT ── */
  .result-lead {
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 3px; color: var(--gold);
    text-align: center; display: block; margin-bottom: 22px;
  }
  .result-cards { display: grid; gap: 4px; margin-bottom: 26px; }
  .result-cards.two { grid-template-columns: 1fr 1fr; }

  .rcard {
    background: var(--bg4); border: 1px solid var(--gold2);
    padding: 28px 26px 24px;
    display: flex; flex-direction: column;
  }
  .rcard-tag {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 2px; color: var(--gold);
    display: block; margin-bottom: 10px;
  }
  .rcard h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 2.6vw, 28px);
    font-weight: 400; color: var(--text);
    line-height: 1.15; margin-bottom: 10px;
  }
  .rcard h4 em { font-style: italic; color: var(--gold); }
  .rcard p {
    font-size: 14px; color: var(--text2);
    line-height: 1.7; margin-bottom: 18px; flex: 1;
  }
  .rcard-bottom {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px; padding-top: 16px; border-top: 1px solid var(--line);
    margin-top: auto;
  }
  .rcard-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 300; color: var(--gold); line-height: 1;
  }
  .rcard-meta {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 1.5px; color: var(--text3); margin-top: 4px;
  }

  .btn-primary {
    font-family: 'Cinzel', serif; font-size: 10px;
    letter-spacing: 2px; padding: 11px 20px;
    background: var(--gold); color: #0a0a0f;
    border: 1px solid var(--gold); text-decoration: none;
    display: inline-block; transition: all 0.2s; white-space: nowrap;
  }
  .btn-primary:hover { background: transparent; color: var(--gold); }
  .btn-ghost {
    font-family: 'Cinzel', serif; font-size: 10px;
    letter-spacing: 2px; padding: 11px 20px;
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold2); text-decoration: none;
    display: inline-block; transition: all 0.2s; white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--gold3); }

  /* ── FOOTER ROW ── */
  .chooser-foot {
    display: flex; align-items: center; justify-content: center;
    gap: 22px; flex-wrap: wrap;
    margin-top: 28px; padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .restart {
    background: none; border: none; cursor: pointer;
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 2px; color: var(--text3);
    transition: color 0.2s; padding: 0;
  }
  .restart:hover { color: var(--gold); }
  .foot-link {
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 2px; color: var(--text3);
    text-decoration: none; transition: color 0.2s;
  }
  .foot-link:hover { color: var(--gold); }
  .foot-sep { width: 4px; height: 4px; background: var(--text3); transform: rotate(45deg); opacity: 0.5; }

  .hidden { display: none !important; }

  .fade { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── RESPONSIVE ── */
  @media (max-width: 760px) {
    .chooser { padding: 34px 24px 28px; }
    .options.three { grid-template-columns: 1fr; }
    .result-cards.two { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .cta-section { padding: 50px 12px 60px; }
    .chooser { padding: 28px 18px 24px; }
    .options.two { grid-template-columns: 1fr; }
    .opt { padding: 18px 16px; }
    .rcard { padding: 24px 18px 20px; }
    .rcard-bottom { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<section class="cta-section">
  <div class="cta-inner">

    <div class="cta-header">
      <span class="eyebrow">STILL DECIDING</span>
      <h3>Not Sure Which<br><em>Is Yours?</em></h3>
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line"></div>
      </div>
    </div>

    <div class="chooser">
      <div class="progress" id="progress"></div>
      <div id="stage"></div>

      <div class="chooser-foot">
        <button class="restart hidden" id="restart" type="button">&#8592; Start Over</button>
        <span class="foot-sep hidden" id="footsep"></span>
        <a class="foot-link" href="https://www.shivohampath.com/contact" target="_top">Ask Veena Directly</a>
      </div>
    </div>

  </div>
</section>

<script>
(function () {
  var BOOK = 'https://www.shivohampath.com/booking-calendar/';

  var R = {
    single:   { tag:'PATH ONE · ONE CARD',    name:'Single <em>Draw</em>',            price:'₹599',   meta:'WITHIN 24 HOURS', url: BOOK+'shiva-oracle-single-draw',
                blurb:'One question, one card, answered plainly in writing. The gentlest way in — and it asks nothing of you but the question itself.' },
    three:    { tag:'PATH ONE · THREE CARDS', name:'Three-Card <em>Spread</em>',      price:'₹1,199', meta:'PDF REPORT', url: BOOK+'shiva-oracle-three-card-spread',
                blurb:'Root, Present, Emergence — three cards laid across time, for a situation that has a history behind it.' },
    full:     { tag:'PATH ONE · FIVE CARDS',  name:'Shiva Oracle <em>Full Spread</em>', price:'₹1,499', meta:'PDF REPORT', url: BOOK+'shiva-oracle-reading-pdf-report-only',
                blurb:'Five cards for the whole shape of the season you are standing in. The deepest the written work goes before a chart is needed.' },
    specific: { tag:'PATH TWO · 30 MINUTES',  name:'Specific Question <em>Reading</em>', price:'₹2,499', meta:'30 MIN · ONLINE', url: BOOK+'specific-question-reading-30-mins',
                blurb:'One area of life, opened completely. We go deep on the single thing that feels stuck, and we go deep on it properly.' },
    knots:    { tag:'PATH TWO · SIGNATURE',   name:'Karmic Knots <em>Reading</em>',   price:'₹6,500', meta:'60 MIN · ONLINE', url: BOOK+'karmic-knots-reading-60-mins',
                blurb:'The full soul audit — D1, D9 and D60 read together. The root karma beneath the patterns that keep returning, across every lifetime that made them.' },
    synastry: { tag:'PATH TWO · TWO CHARTS',  name:'Synastry &amp; <em>Kundali Milan</em>', price:'₹9,400', meta:'90 MIN · ONLINE', url: BOOK+'synastry-kundali-milan',
                blurb:'Karmic bond analysis between two charts — why you keep finding each other, and what contract exists between your souls.' },
    varsha:   { tag:'PATH TWO · SOLAR RETURN', name:'Varshaphala <em>Annual Reading</em>', price:'₹5,500', meta:'60 MIN · ONLINE', url: BOOK+'varshaphala-annual-reading',
                blurb:'The twelve months beginning on your next birthday — what this year carries, and which months are the ones to move in.' },
    muhurta:  { tag:'PATH TWO · ELECTIONAL',  name:'Muhurta <em>Timing Selection</em>', price:'₹3,500', meta:'30 MIN · ONLINE', url: BOOK+'muhurta-timing-selection',
                blurb:'Choosing the hour rather than reading it. For a marriage, a launch, a journey — a beginning that deserves to be started well.' },
    moksha:   { tag:'PATH TWO · ADVANCED',    name:'Advanced Moksha <em>Consultation</em>', price:'₹8,500', meta:'90 MIN · ONLINE', url: BOOK+'advanced-moksha-path-consultation',
                blurb:'The soul’s liberation path — where you are in the cycle of return, and what this lifetime is asking you to finally complete.' },
    madhurya: { tag:'PATH TWO · BHAKTI',      name:'Madhurya Bhakta <em>Sessions</em>', price:'₹7,500', meta:'2 HOURS · ONLINE', url: BOOK+'madhurya-bhakta-sessions',
                blurb:'For those who love Shiv as Beloved rather than as deity. A sacred conversation held with your chart, your devotional history, and your longing.' },
    followup: { tag:'PATH TWO · RETURNING',   name:'Follow-Up <em>Session</em>', price:'₹2,999', meta:'30 MIN · ONLINE', url: BOOK+'follow-up-integration-session',
                blurb:'For when you have lived with your reading a while and the questions have changed — or something has moved and you want to look at it together.' }
  };

  var STEPS = {
    start: {
      q: 'Do you know your exact birth time?',
      sub: 'Date, time, and place — as precisely as you can. The D60 shifts on four minutes.',
      cols: 'two',
      options: [
        { label: 'Yes, I have all three',    sub: 'The chart can be read in full.', next: 'chart' },
        { label: 'No, or not exactly',       sub: 'Then the oracle is your door.',  next: 'oracle' }
      ]
    },
    oracle: {
      q: 'How much are you carrying?',
      sub: 'Written readings. Nothing to schedule.',
      cols: 'three',
      options: [
        { label: 'One clear question',        sub: 'Something specific you already know you need to ask.', result: ['single'] },
        { label: 'A situation with a history', sub: 'Something that started long before now.',             result: ['three'] },
        { label: 'A whole season of my life',  sub: 'Not one question — the shape of all of it.',          result: ['full'] }
      ]
    },
    chart: {
      q: 'What brings you?',
      sub: 'All chart readings are live, and all are recorded for you.',
      cols: 'two',
      options: [
        { label: 'One area of life',           sub: 'A single thing that feels stuck.',              result: ['specific'] },
        { label: 'My patterns — all of them',  sub: 'The ones that keep returning, lifetime after lifetime.', result: ['knots'] },
        { label: 'A relationship',             sub: 'Why the two of you keep finding each other.',   result: ['synastry'] },
        { label: 'The year ahead',             sub: 'What these next twelve months are carrying.',   result: ['varsha'] },
        { label: 'Choosing a date',            sub: 'A marriage, a launch, a beginning.',            result: ['muhurta'] },
        { label: 'The deeper path',            sub: 'Liberation, or devotion to Shiv as Beloved.',   result: ['moksha','madhurya'] },
        { label: 'I have read with you before', sub: 'Something has moved since we last spoke.',     result: ['followup'] }
      ]
    }
  };

  var stage    = document.getElementById('stage');
  var progress = document.getElementById('progress');
  var restart  = document.getElementById('restart');
  var footsep  = document.getElementById('footsep');

  function pips(active, total) {
    progress.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var p = document.createElement('span');
      p.className = 'pip' + (i <= active ? ' on' : '');
      progress.appendChild(p);
    }
  }

  function toggleRestart(show) {
    restart.classList.toggle('hidden', !show);
    footsep.classList.toggle('hidden', !show);
  }

  function renderStep(key) {
    var step = STEPS[key];
    pips(key === 'start' ? 0 : 1, 3);
    toggleRestart(key !== 'start');

    var html = '<div class="fade">';
    html += '<div class="q-text">' + step.q + '</div>';
    html += '<div class="q-sub">' + step.sub + '</div>';
    html += '<div class="options ' + step.cols + '">';
    step.options.forEach(function (o, i) {
      html += '<button class="opt" type="button" data-i="' + i + '">' +
                '<span class="opt-label">' + o.label + '</span>' +
                '<span class="opt-sub">' + o.sub + '</span>' +
              '</button>';
    });
    html += '</div></div>';
    stage.innerHTML = html;

    Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function (btn) {
      btn.addEventListener('click', function () {
        var o = step.options[parseInt(btn.getAttribute('data-i'), 10)];
        if (o.next) { renderStep(o.next); }
        else { renderResult(o.result); }
      });
    });
  }

  function renderResult(keys) {
    pips(2, 3);
    toggleRestart(true);

    var lead = keys.length > 1 ? 'TWO READINGS MEET YOU HERE' : 'THIS IS YOURS';
    var html = '<div class="fade">';
    html += '<span class="result-lead">' + lead + '</span>';
    html += '<div class="result-cards' + (keys.length > 1 ? ' two' : '') + '">';
    keys.forEach(function (k) {
      var r = R[k];
      html += '<div class="rcard">' +
                '<span class="rcard-tag">' + r.tag + '</span>' +
                '<h4>' + r.name + '</h4>' +
                '<p>' + r.blurb + '</p>' +
                '<div class="rcard-bottom">' +
                  '<div><div class="rcard-price">' + r.price + '</div>' +
                  '<div class="rcard-meta">' + r.meta + '</div></div>' +
                  '<a class="btn-primary" href="' + r.url + '" target="_top">Book This</a>' +
                '</div>' +
              '</div>';
    });
    html += '</div></div>';
    stage.innerHTML = html;
  }

  restart.addEventListener('click', function () { renderStep('start'); });
  renderStep('start');
})();
</script>

</body>
</html>
